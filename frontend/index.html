<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women Safety Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .user-btn {
            background: #4CAF50;
            color: white;
        }

        .volunteer-btn {
            background: #2196F3;
            color: white;
        }

        .admin-btn {
            background: #555;
            color: white;
        }

        .sos-btn {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Women Safety Platform</h1>

    <p>Stay Safe. Stay Connected.</p>

    <hr>

    <h2>Login</h2>

    <button class="user-btn" onclick="window.location.href='login.html'">
        👩 User Login
    </button>

    <button class="volunteer-btn" onclick="window.location.href='volunteer-login.html'">
        🦺 Volunteer Login
    </button>

    <button class="admin-btn" onclick="window.location.href='admin-dashboard.html'">
        👨‍💼 Admin
    </button>

    <hr>

    <h2>Emergency</h2>

    <button class="sos-btn" onclick="sendSOS()">
        🚨 SOS
    </button>

    <p id="message"></p>

    <script src="js/sos.js"></script>

</body>
</html>
